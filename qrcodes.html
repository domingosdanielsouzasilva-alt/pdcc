<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDCC - QR Codes dos Veículos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container-fluid">
    <div class="row">
        <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block bg-dark sidebar collapse min-vh-100 p-3 text-white">
            <div class="position-sticky pt-3">
                <h4 class="text-center fw-bold mb-4 text-primary">PDCC</h4>
                <ul class="nav flex-column gap-2">
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="dashboard.html">
                            <i class="bi bi-speedometer2 me-2"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item" id="menuUsuarios" style="display: none;">
                        <a class="nav-link text-white-50" href="usuarios.html">
                            <i class="bi bi-person-lock me-2"></i> Usuários
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="clientes.html">
                            <i class="bi bi-people me-2"></i> Clientes
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="veiculos.html">
                            <i class="bi bi-car-front me-2"></i> Veículos
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="servicos.html">
                            <i class="bi bi-tools me-2"></i> Serviços
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="garantias.html">
                            <i class="bi bi-shield-check me-2"></i> Garantias
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white active bg-primary rounded" href="qrcodes.html">
                            <i class="bi bi-qr-code me-2"></i> QR Codes
                        </a>
                    </li>
                </ul>
                <hr class="text-secondary my-4">
                <button onclick="logout()" class="btn btn-outline-danger w-100 btn-sm">
                    <i class="bi bi-box-arrow-left me-2"></i> Sair
                </button>
            </div>
        </nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2 fw-bold text-dark">QR Codes dos Veículos</h1>
                <span class="text-muted">Prontuário Digital Curto-Circuito</span>
            </div>

            <div class="row g-4" id="listaQRCodes">
                <div class="col-12 text-center text-muted">
                    <p>Carregando dados...</p>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const API_URL = 'https://pdcc-api.onrender.com';

    async function carregarQRCodes() {
        try {
            const response = await fetch(`${API_URL}/api/veiculos`);
            if (response.ok) {
                const veiculos = await response.json();
                const container = document.getElementById('listaQRCodes');
                container.innerHTML = '';

                if (veiculos.length === 0) {
                    container.innerHTML = `
                        <div class="col-12 text-center text-muted">
                            <p>Nenhum veículo registado para gerar QR Code.</p>
                        </div>
                    `;
                    return;
                }

                veiculos.forEach(v => {
                    const col = document.createElement('div');
                    col.className = 'col-md-4 col-lg-3';

                    const linkConsulta = `consulta.html?id=${v.id}`;

                    col.innerHTML = `
                        <div class="card border-0 shadow-sm rounded-4 p-3 text-center h-100">
                            <h5 class="fw-bold text-primary mb-1">${v.modelo}</h5>
                            <p class="text-muted mb-3"><span class="badge bg-secondary">${v.placa}</span></p>

                            <div class="bg-light p-3 rounded-3 mb-3 d-flex justify-content-center">
                                <!-- Endpoint do back-end que gera a imagem do QR Code -->
                                <img src="${API_URL}/api/veiculos/${v.id}/qrcode" alt="QR Code" class="img-fluid rounded" style="width: 180px; height: 180px;">
                            </div>

                            <a href="${linkConsulta}" target="_blank" class="btn btn-outline-primary btn-sm w-100 fw-semibold">
                                <i class="bi bi-box-arrow-up-right me-1"></i> Abrir Consulta
                            </a>
                        </div>
                    `;
                    container.appendChild(col);
                });
            }
        } catch (err) {
            console.error("Erro ao carregar QR codes:", err);
            document.getElementById('listaQRCodes').innerHTML = `
                <div class="col-12 text-center text-danger">
                    <p>Erro ao conectar.</p>
                </div>
            `;
        }
    }

    document.addEventListener("DOMContentLoaded", () => {
        const role = localStorage.getItem('usuarioRole');

        if (role === 'ADMIN') {
            const menuU = document.getElementById('menuUsuarios');
            if (menuU) {
                menuU.style.display = 'block';
            }
        }
    });

    function logout() {
        localStorage.removeItem('usuarioNome');
        localStorage.removeItem('usuarioRole');
        window.location.href = 'login.html';
    }

    carregarQRCodes();
</script>
</body>
</html>
