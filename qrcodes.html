<head>

    <link

            rel="stylesheet"
    >

    <link
            href="css/pdcc.css"
            rel="stylesheet"
    >
</head>

<body>

<div class="container-fluid">

    <div class="row">

        <nav

                    >

                    <h4 class="pdcc-sidebar-brand mb-0">
                        PDCC
                    </h4>

                    <small class="text-white-50">
                        Prontuário Digital
                    </small>

                </div>

                <ul class="nav flex-column gap-2">

                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">
                            <i class="bi bi-speedometer2 me-2"></i>
                            Dashboard
                        </a>
                    </li>

                    <li
                            class="nav-item"
                            id="menuUsuarios"
                            style="display: none;"
                    >
                        <a class="nav-link" href="usuarios.html">
                            <i class="bi bi-person-lock me-2"></i>

                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="clientes.html">
                            <i class="bi bi-people me-2"></i>
                            Clientes
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="veiculos.html">
                            <i class="bi bi-car-front me-2"></i>
                            Veículos
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="servicos.html">
                            <i class="bi bi-tools me-2"></i>
                            Serviços
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="garantias.html">
                            <i class="bi bi-shield-check me-2"></i>
                            Garantias
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="qrcodes.html">
                            <i class="bi bi-qr-code me-2"></i>
                            QR Codes
                        </a>
                    </li>

                </ul>

                <hr class="text-secondary my-4">

                <button

                    <i class="bi bi-box-arrow-left me-2"></i>
                    Sair
                </button>

            </div>

        </nav>

        <main
                class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4"
        >

            <div
                    class="pdcc-header d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-2 pb-3 mb-4"
            >

                <div>

                    <h1 class="pdcc-page-title h2 mb-1">
                        QR Codes dos Veículos
                    </h1>

                    <p class="pdcc-page-subtitle mb-0">
                        Consulta pública dos veículos
                    </p>

                </div>

                <div class="text-md-end mt-3 mt-md-0">

                    <span class="text-pdcc-muted small d-block">
                        Usuário conectado
                    </span>

                    <strong
                            id="usuarioLogado"
                            class="text-pdcc"
                    >
                        -
                    </strong>

                </div>

            </div>

            <div
                    id="mensagem"
                    class="alert d-none"
                    role="alert"
            >
            </div>

            <div
                    class="d-flex justify-content-between flex-wrap align-items-center gap-3 mb-4"
            >

                <h5 class="pdcc-section-title mb-0">
                    Veículos Cadastrados
                </h5>

                <span
                        id="totalVeiculos"
                        class="badge rounded-pill bg-pdcc px-3 py-2"
                >
                    0 veículos
                </span>

            </div>

            <div
                    class="row g-4"
                    id="listaQRCodes"
            >

                <div class="col-12">

                    <div
                            class="pdcc-card p-5 text-center text-pdcc-muted"
                    >

                        <div
                                class="spinner-border text-pdcc mb-3"
                                role="status"
                        >
                            <span class="visually-hidden">
                                Carregando
                            </span>
                        </div>

                        <p class="mb-0">
                            Carregando veículos...
                        </p>

                    </div>

                </div>

            </div>

        </main>

    </div>

</div>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
</script>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>

<script>
    let veiculosCache = [];

    const qrUrlsAtivas =
        new Map();

    function escaparHtml(valor) {
        if (
            valor === null ||
            valor === undefined
        ) {
            return '';
        }

        return String(valor)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#039;');
    }

    function mostrarMensagem(
        texto,
        tipo = 'danger'
    ) {
        const mensagem =
            document.getElementById(
                'mensagem'
            );

        mensagem.className =
            `alert alert-${tipo}`;

        mensagem.textContent =
            texto;

        mensagem.classList.remove(
            'd-none'
        );

        window.setTimeout(() => {
            mensagem.classList.add(
                'd-none'
            );
        }, 4500);
    }

    function atualizarTotalVeiculos() {
        const total =
            veiculosCache.length;

        document
            .getElementById(
                'totalVeiculos'
            )
            .textContent =
            `${total} ${total === 1 ? 'veículo' : 'veículos'}`;
    }

    function liberarQrUrl(veiculoId) {
        const urlAnterior =
            qrUrlsAtivas.get(
                veiculoId
            );

        if (urlAnterior) {
            URL.revokeObjectURL(
                urlAnterior
            );

            qrUrlsAtivas.delete(
                veiculoId
            );
        }
    }

    async function carregarImagemQr(
        veiculo
    ) {
        const imagem =
            document.getElementById(
                `qr-imagem-${veiculo.id}`
            );

        const carregamento =
            document.getElementById(
                `qr-carregamento-${veiculo.id}`
            );

        const erro =
            document.getElementById(
                `qr-erro-${veiculo.id}`
            );

        const botaoDownload =
            document.getElementById(
                `qr-download-${veiculo.id}`
            );

        try {
            const response =
                await apiFetch(
                    `/api/veiculos/${veiculo.id}/qrcode`
                );

            if (!response) {
                return;
            }

            if (!response.ok) {
                carregamento.classList.add(
                    'd-none'
                );

                erro.classList.remove(
                    'd-none'
                );

                return;
            }

            const blob =
                await response.blob();

            liberarQrUrl(
                veiculo.id
            );

            const url =
                URL.createObjectURL(
                    blob
                );

            qrUrlsAtivas.set(
                veiculo.id,
                url
            );

            imagem.src =
                url;

            imagem.classList.remove(
                'd-none'
            );

            carregamento.classList.add(
                'd-none'
            );

            botaoDownload.disabled =
                false;

        } catch (error) {
            carregamento.classList.add(
                'd-none'
            );

            erro.classList.remove(
                'd-none'
            );
        }
    }

    function baixarQrCode(
        veiculoId,
        placa
    ) {
        const url =
            qrUrlsAtivas.get(
                veiculoId
            );

        if (!url) {
            mostrarMensagem(
                'O QR Code ainda não está disponível para download.'
            );

            return;
        }

        const placaArquivo =
            String(placa || veiculoId)
                .replace(
                    /[^A-Za-z0-9-]/g,
                    ''
                )
                .toUpperCase();

        const link =
            document.createElement(
                'a'
            );

        link.href =
            url;

        link.download =
            `qr-code-${placaArquivo}.png`;

        document.body.appendChild(
            link
        );

        link.click();

        link.remove();
    }

    function criarCardVeiculo(
        veiculo
    ) {
        const coluna =
            document.createElement(
                'div'
            );

        coluna.className =
            'col-md-6 col-xl-4';

        const modelo =
            escaparHtml(
                veiculo.modelo || 'Veículo'
            );

        const placa =
            escaparHtml(
                veiculo.placa || '-'
            );

        const cliente =
            veiculo.cliente
                ? escaparHtml(
                    veiculo.cliente.nome
                )
                : 'Cliente não informado';

        coluna.innerHTML = `
            <div
                class="pdcc-card p-4 text-center h-100"
            >

                <div
                    class="d-flex justify-content-between align-items-start mb-3"
                >

                    <div class="text-start">

                        <h5
                            class="text-pdcc fw-bold mb-2"
                        >
                            ${modelo}
                        </h5>

                        <span
                            class="pdcc-badge-plate"
                        >
                            ${placa}
                        </span>

                    </div>

                    <div
                        class="bg-pdcc-soft rounded-3 p-2 text-pdcc"
                    >
                        <i class="bi bi-car-front fs-5"></i>
                    </div>

                </div>

                <div
                    class="text-pdcc-muted small text-start mb-3"
                >
                    <i class="bi bi-person me-1"></i>
                    ${cliente}
                </div>

                <div
                    class="bg-pdcc-soft rounded-3 p-3 mb-3 d-flex align-items-center justify-content-center"
                    style="min-height: 220px;"
                >

                    <div
                        id="qr-carregamento-${veiculo.id}"
                        class="text-center"
                    >

                        <div
                            class="spinner-border text-pdcc"
                            role="status"
                        >
                            <span class="visually-hidden">
                                Carregando QR Code
                            </span>
                        </div>

                    </div>

                    <img
                        id="qr-imagem-${veiculo.id}"
                        alt="QR Code do veículo ${placa}"
                        class="img-fluid d-none"
                        style="width: 190px; height: 190px; object-fit: contain;"
                    >

                    <div
                        id="qr-erro-${veiculo.id}"
                        class="d-none text-danger"
                    >

                        <i
                            class="bi bi-exclamation-circle fs-2 d-block mb-2"
                        ></i>

                        <span class="small">
                            QR Code indisponível
                        </span>

                    </div>

                </div>

                <button
                    type="button"
                    id="qr-download-${veiculo.id}"
                    class="btn btn-pdcc w-100 fw-semibold"
                    disabled
                    onclick="baixarQrCode(${veiculo.id}, '${placa}')"
                >
                    <i class="bi bi-download me-1"></i>
                    Baixar QR Code
                </button>

            </div>
        `;

        return coluna;
    }

    async function carregarQRCodes() {
        const container =
            document.getElementById(
                'listaQRCodes'
            );

        try {
            const response =
                await apiFetch(
                    '/api/veiculos'
                );

            if (!response) {
                return;
            }

            if (!response.ok) {
                container.innerHTML = `
                    <div class="col-12">

                        <div
                            class="pdcc-card p-5 text-center text-danger"
                        >
                            <i
                                class="bi bi-exclamation-circle fs-2 d-block mb-2"
                            ></i>

                            Não foi possível carregar os veículos.
                        </div>

                    </div>
                `;

                mostrarMensagem(
                    'Não foi possível carregar os veículos.'
                );

                return;
            }

            veiculosCache =
                await response.json();

            atualizarTotalVeiculos();

            container.innerHTML = '';

            if (
                veiculosCache.length === 0
            ) {
                container.innerHTML = `
                    <div class="col-12">

                        <div
                            class="pdcc-card p-5 text-center"
                        >

                            <i
                                class="bi bi-qr-code fs-1 text-pdcc d-block mb-3"
                            ></i>

                            <h5
                                class="text-pdcc fw-bold"
                            >
                                Nenhum veículo cadastrado
                            </h5>

                        </div>

                    </div>
                `;

                return;
            }

            veiculosCache.forEach(
                veiculo => {
                    const card =
                        criarCardVeiculo(
                            veiculo
                        );

                    container.appendChild(
                        card
                    );
                }
            );

            await Promise.all(
                veiculosCache.map(
                    veiculo =>
                        carregarImagemQr(
                            veiculo
                        )
                )
            );

        } catch (error) {
            container.innerHTML = `
                <div class="col-12">

                    <div
                        class="pdcc-card p-5 text-center text-danger"
                    >
                        <i
                            class="bi bi-exclamation-circle fs-2 d-block mb-2"
                        ></i>

                        Erro ao conectar com o servidor.
                    </div>

                </div>
            `;

            mostrarMensagem(
                'Erro ao conectar com o servidor.'
            );
        }
    }

    window.addEventListener(
        'beforeunload',
        function () {
            qrUrlsAtivas.forEach(
                url => {
                    URL.revokeObjectURL(
                        url
                    );
                }
            );

            qrUrlsAtivas.clear();
        }
    );

    document.addEventListener(
        'DOMContentLoaded',
        async function () {
            protegerPagina();

            if (!estaAutenticado()) {
                return;
            }

            const usuarioLogado =
                document.getElementById(
                    'usuarioLogado'
                );

            if (usuarioLogado) {
                usuarioLogado.textContent =
                    getUsuarioNome()
                    || 'Usuário';
            }

            if (
                getUsuarioRole()
                === 'ADMIN'
            ) {
                const menuUsuarios =
                    document.getElementById(
                        'menuUsuarios'
                    );

                if (menuUsuarios) {
                    menuUsuarios.style.display =
                        'block';
                }
            }

            await carregarQRCodes();
        }
    );
</script>
</body>
</html>
