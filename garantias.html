<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDCC - Controle de Garantias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container-fluid">
    <div class="row">
        <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block bg-dark sidebar collapse min-vh-100 p-3 text-white">
            <div class="position-sticky pt-3">
                <h4 class="text-center fw-bold mb-4 text-primary">PDCC</h4>
                <ul class="nav flex-column gap-2">
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="dashboard.html">
                            <i class="bi bi-speedometer2 me-2"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item" id="menuUsuarios" style="display: none;">
                        <a class="nav-link text-white-50" href="usuarios.html">
                            <i class="bi bi-person-lock me-2"></i> Usuários
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="clientes.html">
                            <i class="bi bi-people me-2"></i> Clientes
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="veiculos.html">
                            <i class="bi bi-car-front me-2"></i> Veículos
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="servicos.html">
                            <i class="bi bi-tools me-2"></i> Serviços
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white active bg-primary rounded" href="garantias.html">
                            <i class="bi bi-shield-check me-2"></i> Garantias
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="qrcodes.html">
                            <i class="bi bi-qr-code me-2"></i> QR Codes
                        </a>
                    </li>
                </ul>
                <hr class="text-secondary my-4">
                <button onclick="logout()" class="btn btn-outline-danger w-100 btn-sm">
                    <i class="bi bi-box-arrow-left me-2"></i> Sair
                </button>
            </div>
        </nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2 fw-bold text-dark">Controle de Garantias</h1>
                <span class="text-muted">Prontuário Digital Curto-Circuito</span>
            </div>

            <div class="card border-0 shadow-sm rounded-4 p-4">
                <h5 class="fw-bold mb-3"><i class="bi bi-shield-shaded me-2 text-primary"></i>Monitoramento de Garantias</h5>
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-dark">
                        <tr>
                            <th>Cliente</th>
                            <th>Veículo / Placa</th>
                            <th>Serviço Executado</th>
                            <th>Valor</th>
                            <th>Data do Serviço</th>
                            <th>Garantia Até</th>
                            <th class="text-center">Status</th>
                        </tr>
                        </thead>
                        <tbody id="tabelaGarantias">
                        <tr>
                            <td colspan="7" class="text-center text-muted">Carregando dados...</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const API_URL = 'https://pdcc-api.onrender.com';

    async function carregarGarantias() {
        try {
            const response = await fetch(`${API_URL}/api/servicos`);
            if (response.ok) {
                const servicos = await response.json();
                const tabela = document.getElementById('tabelaGarantias');
                tabela.innerHTML = '';

                if (servicos.length === 0) {
                    tabela.innerHTML = `<tr><td colspan="7" class="text-center text-muted">Nenhum registo encontrado.</td></tr>`;
                    return;
                }

                const hojeStr = new Date().toISOString().split('T')[0];
                const hoje = new Date(hojeStr);

                servicos.forEach(s => {
                    let statusBadge = '<span class="badge bg-secondary">Sem garantia</span>';

                    if (s.garantiaFim) {
                        const dataFim = new Date(s.garantiaFim);
                        if (dataFim > hoje) {
                            statusBadge = '<span class="badge bg-success">Ativa</span>';
                        } else if (dataFim < hoje) {
                            statusBadge = '<span class="badge bg-danger">Vencida</span>';
                        } else {
                            statusBadge = '<span class="badge bg-warning text-dark">Vence hoje</span>';
                        }
                    }

                    const clienteNome = s.veiculo && s.veiculo.cliente ? s.veiculo.cliente.nome : 'N/D';
                    const veiculoModelo = s.veiculo ? s.veiculo.modelo : 'N/D';
                    const veiculoPlaca = s.veiculo ? s.veiculo.placa : 'N/D';
                    const valorFormatado = s.valorServico ? `R$ ${parseFloat(s.valorServico).toFixed(2)}` : 'R$ 0,00';

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="fw-semibold">${clienteNome}</td>
                        <td>${veiculoModelo} <br><span class='badge bg-secondary'>${veiculoPlaca}</span></td>
                        <td>${s.servicoExecutado || '-'}</td>
                        <td class="text-success">${valorFormatado}</td>
                        <td>${s.dataServico || '-'}</td>
                        <td>${s.garantiaFim || '-'}</td>
                        <td class="text-center">${statusBadge}</td>
                    `;
                    tabela.appendChild(tr);
                });
            }
        } catch (err) {
            console.error("Erro ao carregar garantias:", err);
            document.getElementById('tabelaGarantias').innerHTML = `
                <tr><td colspan="7" class="text-center text-danger">Erro ao conectar com a API.</td></tr>
            `;
        }
    }

    document.addEventListener("DOMContentLoaded", () => {
        const role = localStorage.getItem('usuarioRole');

        if (role === 'ADMIN') {
            const menuU = document.getElementById('menuUsuarios');
            if (menuU) {
                menuU.style.display = 'block';
            }
        }
    });

    function logout() {
        localStorage.removeItem('usuarioNome');
        localStorage.removeItem('usuarioRole');
        window.location.href = 'login.html';
    }

    carregarGarantias();
</script>
</body>
</html>
