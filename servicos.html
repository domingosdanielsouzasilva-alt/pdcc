<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDCC - Registo de Serviços</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container-fluid">
    <div class="row">
        <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block bg-dark sidebar collapse min-vh-100 p-3 text-white">
            <div class="position-sticky pt-3">
                <h4 class="text-center fw-bold mb-4 text-primary">PDCC</h4>
                <ul class="nav flex-column gap-2">
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="dashboard.html">
                            <i class="bi bi-speedometer2 me-2"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item" id="menuUsuarios" style="display: none;">
                        <a class="nav-link text-white-50" href="usuarios.html">
                            <i class="bi bi-person-lock me-2"></i> Usuários
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="clientes.html">
                            <i class="bi bi-people me-2"></i> Clientes
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="veiculos.html">
                            <i class="bi bi-car-front me-2"></i> Veículos
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white active bg-primary rounded" href="servicos.html">
                            <i class="bi bi-tools me-2"></i> Serviços
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="garantias.html">
                            <i class="bi bi-shield-check me-2"></i> Garantias
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="qrcodes.html">
                            <i class="bi bi-qr-code me-2"></i> QR Codes
                        </a>
                    </li>
                </ul>
                <hr class="text-secondary my-4">
                <button onclick="logout()" class="btn btn-outline-danger w-100 btn-sm">
                    <i class="bi bi-box-arrow-left me-2"></i> Sair
                </button>
            </div>
        </nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2 fw-bold text-dark">Registo Técnico de Serviços</h1>
                <span class="text-muted">Prontuário Digital Curto-Circuito</span>
            </div>

            <div class="card border-0 shadow-sm rounded-4 p-4 mb-4">
                <h5 class="fw-bold mb-3"><i class="bi bi-wrench me-2 text-primary"></i>Novo Serviço</h5>
                <form id="servicoForm">
                    <input type="hidden" id="servicoId">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="veiculoSelect" class="form-label small fw-bold">Veículo</label>
                            <select class="form-select" id="veiculoSelect" required>
                                <option value="">Carregando veículos...</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="dataServico" class="form-label small fw-bold">Data do Serviço</label>
                            <input type="date" class="form-control" id="dataServico" required>
                        </div>
                        <div class="col-md-6">
                            <label for="diagnostico" class="form-label small fw-bold">Diagnóstico Técnico</label>
                            <textarea class="form-control" id="diagnostico" rows="3" placeholder="Descreva o problema detetado..."></textarea>
                        </div>
                        <div class="col-md-6">
                            <label for="servicoExecutado" class="form-label small fw-bold">Serviço Executado</label>
                            <textarea class="form-control" id="servicoExecutado" rows="3" placeholder="Descreva o trabalho feito..."></textarea>
                        </div>
                        <div class="col-md-4">
                            <label for="pecasTrocadas" class="form-label small fw-bold">Peças Substituídas</label>
                            <input type="text" class="form-control" id="pecasTrocadas" placeholder="">
                        </div>
                        <div class="col-md-4">
                            <label for="valorServico" class="form-label small fw-bold">Valor (R$)</label>
                            <input type="number" step="0.01" min="0" class="form-control" id="valorServico" placeholder="0.00">
                        </div>
                        <div class="col-md-4">
                            <label for="garantiaFim" class="form-label small fw-bold">Garantia Até</label>
                            <input type="date" class="form-control" id="garantiaFim">
                        </div>
                    </div>
                    <div class="mt-3">
                        <button type="submit" class="btn btn-primary px-4 fw-semibold">
                            <i class="bi bi-check-lg me-1"></i> Registar Serviço
                        </button>
                    </div>
                </form>
            </div>

            <div class="card border-0 shadow-sm rounded-4 p-4">
                <h5 class="fw-bold mb-3"><i class="bi bi-table me-2 text-primary"></i>Serviços Registados</h5>
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Veículo / Placa</th>
                            <th>Data</th>
                            <th>Diagnóstico</th>
                            <th>Serviço</th>
                            <th>Valor</th>
                            <th>Garantia</th>
                            <th class="text-center">Ações</th>
                        </tr>
                        </thead>
                        <tbody id="tabelaServicos">
                        <tr>
                            <td colspan="8" class="text-center text-muted">Carregando dados...</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const API_URL = 'https://pdcc-api.onrender.com';

    async function carregarSelectVeiculos() {
        try {
            const response = await fetch(`${API_URL}/api/veiculos`);
            if (response.ok) {
                const veiculos = await response.json();
                const select = document.getElementById('veiculoSelect');
                select.innerHTML = '<option value="">Selecione um veículo</option>';
                veiculos.forEach(v => {
                    const opt = document.createElement('option');
                    opt.value = v.id;
                    opt.textContent = `${v.modelo} - Placa: ${v.placa}`;
                    select.appendChild(opt);
                });
            }
        } catch (err) {
            console.error("Erro ao carregar veículos para o select:", err);
        }
    }

    async function carregarServicos() {
        try {
            const response = await fetch(`${API_URL}/api/servicos`);
            if (response.ok) {
                const servicos = await response.json();
                const tabela = document.getElementById('tabelaServicos');
                tabela.innerHTML = '';

                if (servicos.length === 0) {
                    tabela.innerHTML = `<tr><td colspan="8" class="text-center text-muted">Nenhum serviço registado.</td></tr>`;
                    return;
                }

                servicos.forEach(s => {
                    const valorFormatado = s.valorServico ? `R$ ${parseFloat(s.valorServico).toFixed(2)}` : 'R$ 0,00';
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${s.id}</td>
                        <td>${s.veiculo ? `${s.veiculo.modelo} <br><span class='badge bg-secondary'>${s.veiculo.placa}</span>` : 'N/D'}</td>
                        <td>${s.dataServico || '-'}</td>
                        <td>${s.diagnostico || '-'}</td>
                        <td>${s.servicoExecutado || '-'}</td>
                        <td class="fw-semibold text-success">${valorFormatado}</td>
                        <td>${s.garantiaFim || 'Sem garantia'}</td>
                        <td class="text-center">
                            <button onclick="excluirServico(${s.id})" class="btn btn-outline-danger btn-sm">
                                <i class="bi bi-trash"></i> Excluir
                            </button>
                        </td>
                    `;
                    tabela.appendChild(tr);
                });
            }
        } catch (err) {
            console.error("Erro ao carregar serviços:", err);
            document.getElementById('tabelaServicos').innerHTML = `
                <tr><td colspan="8" class="text-center text-danger">Erro ao conectar com a API.</td></tr>
            `;
        }
    }

    document.getElementById('servicoForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const veiculoId = document.getElementById('veiculoSelect').value;
        const servicoData = {
            veiculo: { id: parseInt(veiculoId) },
            dataServico: document.getElementById('dataServico').value,
            diagnostico: document.getElementById('diagnostico').value,
            servicoExecutado: document.getElementById('servicoExecutado').value,
            pecasTrocadas: document.getElementById('pecasTrocadas').value,
            valorServico: document.getElementById('valorServico').value ? parseFloat(document.getElementById('valorServico').value) : null,
            garantiaFim: document.getElementById('garantiaFim').value || null
        };

        try {
            const response = await fetch(`${API_URL}/api/servicos`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(servicoData)
            });

            if (response.ok) {
                document.getElementById('servicoForm').reset();
                carregarServicos();
            } else {
                alert('Erro ao registar o serviço.');
            }
        } catch (err) {
            console.error("Erro ao enviar dados:", err);
        }
    });

    async function excluirServico(id) {
        if (confirm('Deseja realmente excluir este registo de serviço?')) {
            try {
                const response = await fetch(`${API_URL}/api/servicos/${id}`, {
                    method: 'DELETE'
                });
                if (response.ok) {
                    carregarServicos();
                } else {
                    alert('Erro ao excluir serviço.');
                }
            } catch (err) {
                console.error("Erro ao excluir:", err);
            }
        }
    }

    document.addEventListener("DOMContentLoaded", () => {
        const role = localStorage.getItem('usuarioRole');

        if (role === 'ADMIN') {
            const menuU = document.getElementById('menuUsuarios');
            if (menuU) {
                menuU.style.display = 'block';
            }
        }
    });

    function logout() {
        localStorage.removeItem('usuarioNome');
        localStorage.removeItem('usuarioRole');
        window.location.href = 'login.html';
    }

    carregarSelectVeiculos();
    carregarServicos();
</script>
</body>
</html>
