<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDCC - Prontuário Digital Curto-Circuito</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-dark d-flex align-items-center justify-content-center vh-100">

<div class="card shadow-lg border-0 rounded-4 overflow-hidden" style="width: 100%; max-width: 440px;">
    <div class="bg-primary text-white p-4 text-center position-relative">
        <div class="position-absolute top-0 start-0 w-100 h-100 bg-black opacity-10"></div>
        <div class="position-relative">
            <div class="mb-2">
                <i class="bi bi-tools fs-1"></i>
            </div>
            <h3 class="fw-bold mb-1">PDCC</h3>
            <p class="mb-0 text-white-50 small text-uppercase tracking-wider">Prontuário Digital Curto-Circuito</p>
        </div>
    </div>

    <div class="card-body p-4 bg-white">
        <form id="loginForm">
            <div class="mb-3">
                <label for="username" class="form-label text-secondary small fw-bold">Usuário</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                    <input type="text" class="form-control border-start-0 bg-light" id="username" required placeholder="Digite seu usuário">
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label text-secondary small fw-bold">Senha</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                    <input type="password" class="form-control border-start-0 bg-light" id="password" required placeholder="Digite sua senha">
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm">
                <i class="bi bi-box-arrow-in-right me-2"></i>Acessar Sistema
            </button>
        </form>

        <div id="loginError" class="alert alert-danger mt-3 d-none text-center py-2 small" role="alert">
            Usuário ou senha inválidos.
        </div>
    </div>

    <div class="card-footer bg-light text-center py-3 border-0">
        <span class="text-muted small">Sistema de Gestão Automotiva • PDCC v2.0</span>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const API_URL = 'https://pdcc-api.onrender.com';

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const usernameInput = document.getElementById('username').value;
        const passwordInput = document.getElementById('password').value;
        const errorAlert = document.getElementById('loginError');

        errorAlert.classList.add('d-none');

        try {
            const response = await fetch(`${API_URL}/api/auth/login`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    username: usernameInput,
                    password: passwordInput
                })
            });

            if (response.ok) {
                const data = await response.json();

                localStorage.setItem('usuarioNome', data.nome);
                localStorage.setItem('usuarioRole', data.role);

                window.location.href = 'dashboard.html';
            } else {
                errorAlert.classList.remove('d-none');
            }
        } catch (error) {
            console.error('Erro na conexão com a API:', error);
            errorAlert.textContent = 'Erro ao conectar com o servidor.';
            errorAlert.classList.remove('d-none');
        }
    });
</script>
</body>
</html>
