<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PDCC - Gestão de Usuários</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
    >

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
            rel="stylesheet"
    >

    <link
            href="css/pdcc.css"
            rel="stylesheet"
    >
</head>

<body>

<div class="container-fluid">

    <div class="row">

        <nav
                id="sidebar"
                class="col-md-3 col-lg-2 d-md-block pdcc-sidebar sidebar collapse min-vh-100 p-3 text-white"
        >

            <div class="position-sticky pt-3">

                <div class="text-center mb-4">

                    <img
                            src="images/logo-pdcc-icon.png"
                            alt="PDCC"
                            style="width: 72px; height: 72px; object-fit: contain;"
                            class="mb-2"
                    >

                    <h4 class="pdcc-sidebar-brand mb-0">
                        PDCC
                    </h4>

                    <small class="text-white-50">
                        Prontuário Digital
                    </small>

                </div>

                <ul class="nav flex-column gap-2">

                    <li class="nav-item">

                        <a
                                class="nav-link"
                                href="dashboard.html"
                        >
                            <i class="bi bi-speedometer2 me-2"></i>
                            Dashboard
                        </a>

                    </li>

                    <li class="nav-item">

                        <a
                                class="nav-link active"
                                href="usuarios.html"
                        >
                            <i class="bi bi-person-lock me-2"></i>
                            Usuários
                        </a>

                    </li>

                    <li class="nav-item">

                        <a
                                class="nav-link"
                                href="clientes.html"
                        >
                            <i class="bi bi-people me-2"></i>
                            Clientes
                        </a>

                    </li>

                    <li class="nav-item">

                        <a
                                class="nav-link"
                                href="veiculos.html"
                        >
                            <i class="bi bi-car-front me-2"></i>
                            Veículos
                        </a>

                    </li>

                    <li class="nav-item">

                        <a
                                class="nav-link"
                                href="servicos.html"
                        >
                            <i class="bi bi-tools me-2"></i>
                            Serviços
                        </a>

                    </li>

                    <li class="nav-item">

                        <a
                                class="nav-link"
                                href="garantias.html"
                        >
                            <i class="bi bi-shield-check me-2"></i>
                            Garantias
                        </a>

                    </li>

                    <li class="nav-item">

                        <a
                                class="nav-link"
                                href="qrcodes.html"
                        >
                            <i class="bi bi-qr-code me-2"></i>
                            QR Codes
                        </a>

                    </li>

                </ul>

                <hr class="text-secondary my-4">

                <button
                        type="button"
                        onclick="logout()"
                        class="btn btn-outline-danger w-100 btn-sm"
                >
                    <i class="bi bi-box-arrow-left me-2"></i>
                    Sair
                </button>

            </div>

        </nav>

        <main
                class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4"
        >

            <div
                    class="pdcc-header d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-2 pb-3 mb-4"
            >

                <div>

                    <h1 class="pdcc-page-title h2 mb-1">
                        Gestão de Usuários
                    </h1>

                    <p class="pdcc-page-subtitle mb-0">
                        Controle de acessos ao sistema
                    </p>

                </div>

                <div class="text-md-end mt-3 mt-md-0">

                    <span class="text-pdcc-muted small d-block">
                        Usuário conectado
                    </span>

                    <strong
                            id="usuarioLogado"
                            class="text-pdcc"
                    >
                        -
                    </strong>

                </div>

            </div>

            <div
                    id="mensagem"
                    class="alert d-none"
                    role="alert"
            >
            </div>

            <div class="pdcc-card p-4">

                <div
                        class="d-flex justify-content-between flex-wrap align-items-center gap-3 mb-4"
                >

                    <div>

                        <h5 class="pdcc-section-title mb-0">
                            Usuários Cadastrados
                        </h5>

                    </div>

                    <div class="d-flex align-items-center gap-2">

                        <span
                                id="totalUsuarios"
                                class="badge rounded-pill bg-pdcc px-3 py-2"
                        >
                            0 usuários
                        </span>

                        <button
                                type="button"
                                class="btn btn-pdcc btn-sm fw-semibold"
                                data-bs-toggle="modal"
                                data-bs-target="#modalUsuario"
                        >
                            <i class="bi bi-person-plus me-1"></i>
                            Novo Usuário
                        </button>

                    </div>

                </div>

                <div class="table-responsive">

                    <table
                            class="table table-hover align-middle pdcc-table mb-0"
                    >

                        <thead>

                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Usuário</th>
                            <th>Perfil</th>
                            <th class="text-center">Ações</th>
                        </tr>

                        </thead>

                        <tbody id="tabelaUsuarios">

                        <tr>

                            <td
                                    colspan="5"
                                    class="text-center text-muted py-4"
                            >
                                Carregando dados...
                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </main>

    </div>

</div>

<div
        class="modal fade"
        id="modalUsuario"
        tabindex="-1"
        aria-hidden="true"
>

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content border-0 shadow rounded-4">

            <div class="modal-header border-0 pb-0">

                <h5 class="modal-title text-pdcc fw-bold">
                    Novo Usuário
                </h5>

                <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Fechar"
                >
                </button>

            </div>

            <div class="modal-body pt-4">

                <form id="formUsuario">

                    <div class="mb-3">

                        <label
                                for="nome"
                                class="form-label small fw-bold text-pdcc-muted"
                        >
                            Nome Completo
                        </label>

                        <input
                                type="text"
                                id="nome"
                                class="form-control"
                                maxlength="150"
                                required
                                autocomplete="name"
                        >

                    </div>

                    <div class="mb-3">

                        <label
                                for="username"
                                class="form-label small fw-bold text-pdcc-muted"
                        >
                            Nome de Usuário
                        </label>

                        <input
                                type="text"
                                id="username"
                                class="form-control"
                                maxlength="80"
                                required
                                autocomplete="off"
                        >

                    </div>

                    <div class="mb-3">

                        <label
                                for="password"
                                class="form-label small fw-bold text-pdcc-muted"
                        >
                            Senha
                        </label>

                        <div class="input-group">

                            <input
                                    type="password"
                                    id="password"
                                    class="form-control"
                                    required
                                    autocomplete="new-password"
                            >

                            <button
                                    type="button"
                                    class="btn btn-outline-pdcc"
                                    onclick="alternarSenha()"
                                    aria-label="Mostrar ou ocultar senha"
                            >
                                <i
                                        id="iconeSenha"
                                        class="bi bi-eye"
                                ></i>
                            </button>

                        </div>

                    </div>

                    <div class="mb-4">

                        <label
                                for="role"
                                class="form-label small fw-bold text-pdcc-muted"
                        >
                            Perfil de Acesso
                        </label>

                        <select
                                id="role"
                                class="form-select"
                                required
                        >

                            <option value="FUNCIONARIO">
                                Funcionário
                            </option>

                            <option value="ADMIN">
                                Administrador
                            </option>

                        </select>

                    </div>

                    <div class="d-flex gap-2">

                        <button
                                type="button"
                                class="btn btn-outline-secondary flex-grow-1"
                                data-bs-dismiss="modal"
                        >
                            Cancelar
                        </button>

                        <button
                                type="submit"
                                id="botaoSalvar"
                                class="btn btn-pdcc flex-grow-1 fw-semibold"
                        >
                            <i class="bi bi-check-lg me-1"></i>
                            Salvar
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
></script>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>

<script>
    let usuariosCache = [];

    function escaparHtml(valor) {
        if (
            valor === null ||
            valor === undefined
        ) {
            return '';
        }

        return String(valor)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#039;');
    }

    function formatarPerfil(role) {
        if (role === 'ADMIN') {
            return {
                texto: 'Administrador',
                classe: 'bg-pdcc'
            };
        }

        if (role === 'FUNCIONARIO') {
            return {
                texto: 'Funcionário',
                classe: 'bg-secondary'
            };
        }

        return {
            texto: role || '-',
            classe: 'bg-secondary'
        };
    }

    function mostrarMensagem(
        texto,
        tipo = 'success'
    ) {
        const mensagem =
            document.getElementById(
                'mensagem'
            );

        mensagem.className =
            `alert alert-${tipo}`;

        mensagem.textContent =
            texto;

        mensagem.classList.remove(
            'd-none'
        );

        window.setTimeout(() => {
            mensagem.classList.add(
                'd-none'
            );
        }, 4500);
    }

    function atualizarTotalUsuarios() {
        const total =
            usuariosCache.length;

        document
            .getElementById(
                'totalUsuarios'
            )
            .textContent =
            `${total} ${total === 1 ? 'usuário' : 'usuários'}`;
    }

    function preencherTabela() {
        const tabela =
            document.getElementById(
                'tabelaUsuarios'
            );

        tabela.innerHTML = '';

        atualizarTotalUsuarios();

        if (
            usuariosCache.length === 0
        ) {
            tabela.innerHTML = `
                <tr>
                    <td
                        colspan="5"
                        class="text-center text-muted py-4"
                    >
                        Nenhum usuário cadastrado.
                    </td>
                </tr>
            `;

            return;
        }

        const usuariosOrdenados =
            [...usuariosCache]
                .sort((a, b) =>
                    String(a.nome || '')
                        .localeCompare(
                            String(b.nome || ''),
                            'pt-BR'
                        )
                );

        usuariosOrdenados.forEach(
            usuario => {
                const linha =
                    document.createElement(
                        'tr'
                    );

                const perfil =
                    formatarPerfil(
                        usuario.role
                    );

                linha.innerHTML = `
                    <td>
                        ${escaparHtml(usuario.id)}
                    </td>

                    <td class="fw-semibold">
                        ${escaparHtml(usuario.nome)}
                    </td>

                    <td>
                        ${escaparHtml(usuario.username)}
                    </td>

                    <td>
                        <span
                            class="badge ${perfil.classe}"
                        >
                            ${perfil.texto}
                        </span>
                    </td>

                    <td class="text-center">

                        <button
                            type="button"
                            class="btn btn-outline-danger btn-sm"
                            onclick="deletarUsuario(${usuario.id})"
                        >
                            <i class="bi bi-trash me-1"></i>
                            Excluir
                        </button>

                    </td>
                `;

                tabela.appendChild(
                    linha
                );
            }
        );
    }

    async function carregarUsuarios() {
        try {
            const response =
                await apiFetch(
                    '/api/usuarios'
                );

            if (!response) {
                return;
            }

            if (
                response.status === 403
            ) {
                window.location.href =
                    'dashboard.html';

                return;
            }

            if (!response.ok) {
                document
                    .getElementById(
                        'tabelaUsuarios'
                    )
                    .innerHTML = `
                        <tr>
                            <td
                                colspan="5"
                                class="text-center text-danger py-4"
                            >
                                Não foi possível carregar os usuários.
                            </td>
                        </tr>
                    `;

                mostrarMensagem(
                    'Não foi possível carregar os usuários.',
                    'danger'
                );

                return;
            }

            usuariosCache =
                await response.json();

            preencherTabela();

        } catch (error) {
            document
                .getElementById(
                    'tabelaUsuarios'
                )
                .innerHTML = `
                    <tr>
                        <td
                            colspan="5"
                            class="text-center text-danger py-4"
                        >
                            Erro ao conectar com o servidor.
                        </td>
                    </tr>
                `;

            mostrarMensagem(
                'Erro ao conectar com o servidor.',
                'danger'
            );
        }
    }

    function alternarSenha() {
        const campo =
            document.getElementById(
                'password'
            );

        const icone =
            document.getElementById(
                'iconeSenha'
            );

        if (
            campo.type === 'password'
        ) {
            campo.type =
                'text';

            icone.className =
                'bi bi-eye-slash';
        } else {
            campo.type =
                'password';

            icone.className =
                'bi bi-eye';
        }
    }

    async function salvarUsuario(
        event
    ) {
        event.preventDefault();

        const nome =
            document
                .getElementById(
                    'nome'
                )
                .value
                .trim();

        const username =
            document
                .getElementById(
                    'username'
                )
                .value
                .trim();

        const password =
            document
                .getElementById(
                    'password'
                )
                .value;

        const role =
            document
                .getElementById(
                    'role'
                )
                .value;

        if (
            !nome ||
            !username ||
            !password
        ) {
            mostrarMensagem(
                'Preencha os campos obrigatórios.',
                'warning'
            );

            return;
        }

        const dados = {
            nome,
            username,
            password,
            role
        };

        const botao =
            document.getElementById(
                'botaoSalvar'
            );

        botao.disabled =
            true;

        botao.innerHTML =
            '<span class="spinner-border spinner-border-sm me-2"></span>Salvando...';

        try {
            const response =
                await apiFetch(
                    '/api/usuarios',
                    {
                        method: 'POST',
                        body: JSON.stringify(
                            dados
                        )
                    }
                );

            if (!response) {
                return;
            }

            if (response.ok) {
                const modalElemento =
                    document.getElementById(
                        'modalUsuario'
                    );

                const modal =
                    bootstrap.Modal.getInstance(
                        modalElemento
                    );

                if (modal) {
                    modal.hide();
                }

                document
                    .getElementById(
                        'formUsuario'
                    )
                    .reset();

                document
                    .getElementById(
                        'password'
                    )
                    .type =
                    'password';

                document
                    .getElementById(
                        'iconeSenha'
                    )
                    .className =
                    'bi bi-eye';

                await carregarUsuarios();

                mostrarMensagem(
                    'Usuário cadastrado com sucesso.'
                );

                return;
            }

            if (
                response.status === 409
            ) {
                mostrarMensagem(
                    'Este nome de usuário já está cadastrado.',
                    'warning'
                );

                return;
            }

            if (
                response.status === 400
            ) {
                mostrarMensagem(
                    'Verifique os dados informados.',
                    'danger'
                );

                return;
            }

            mostrarMensagem(
                'Não foi possível cadastrar o usuário.',
                'danger'
            );

        } catch (error) {
            mostrarMensagem(
                'Erro ao conectar com o servidor.',
                'danger'
            );

        } finally {
            botao.disabled =
                false;

            botao.innerHTML =
                '<i class="bi bi-check-lg me-1"></i>Salvar';
        }
    }

    async function deletarUsuario(id) {
        const usuario =
            usuariosCache.find(
                item =>
                    item.id === id
            );

        const nome =
            usuario
                ? usuario.nome
                : 'este usuário';

        const confirmar =
            window.confirm(
                `Deseja realmente excluir ${nome}?`
            );

        if (!confirmar) {
            return;
        }

        try {
            const response =
                await apiFetch(
                    `/api/usuarios/${id}`,
                    {
                        method: 'DELETE'
                    }
                );

            if (!response) {
                return;
            }

            if (response.ok) {
                await carregarUsuarios();

                mostrarMensagem(
                    'Usuário excluído com sucesso.'
                );

                return;
            }

            if (
                response.status === 404
            ) {
                mostrarMensagem(
                    'Usuário não encontrado.',
                    'danger'
                );

                return;
            }

            if (
                response.status === 409
            ) {
                mostrarMensagem(
                    'Este usuário não pode ser excluído porque possui registros vinculados.',
                    'warning'
                );

                return;
            }

            mostrarMensagem(
                'Não foi possível excluir o usuário.',
                'danger'
            );

        } catch (error) {
            mostrarMensagem(
                'Erro ao conectar com o servidor.',
                'danger'
            );
        }
    }

    document
        .getElementById(
            'formUsuario'
        )
        .addEventListener(
            'submit',
            salvarUsuario
        );

    document
        .getElementById(
            'modalUsuario'
        )
        .addEventListener(
            'hidden.bs.modal',
            function () {
                document
                    .getElementById(
                        'formUsuario'
                    )
                    .reset();

                document
                    .getElementById(
                        'password'
                    )
                    .type =
                    'password';

                document
                    .getElementById(
                        'iconeSenha'
                    )
                    .className =
                    'bi bi-eye';
            }
        );

    document.addEventListener(
        'DOMContentLoaded',
        async function () {
            protegerAdmin();

            if (
                !estaAutenticado() ||
                getUsuarioRole() !== 'ADMIN'
            ) {
                return;
            }

            const usuarioLogado =
                document.getElementById(
                    'usuarioLogado'
                );

            usuarioLogado.textContent =
                getUsuarioNome()
                || 'Administrador';

            await carregarUsuarios();
        }
    );
</script>
</body>
</html>
