<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDCC - Gestão de Usuários</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<script>
    const roleAtual = localStorage.getItem('usuarioRole');
    if (roleAtual !== 'ADMIN') {
        alert('Acesso restrito a administradores.');
        window.location.href = 'dashboard.html';
    }
</script>

<div class="container-fluid">
    <div class="row">
        <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block bg-dark sidebar collapse min-vh-100 p-3 text-white">
            <div class="position-sticky pt-3">
                <h4 class="text-center fw-bold mb-4 text-primary">PDCC</h4>
                <ul class="nav flex-column gap-2">
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="dashboard.html">
                            <i class="bi bi-speedometer2 me-2"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item" id="menuUsuarios">
                        <a class="nav-link text-white active bg-primary rounded" href="usuarios.html">
                            <i class="bi bi-person-lock me-2"></i> Usuários
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="clientes.html">
                            <i class="bi bi-people me-2"></i> Clientes
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="veiculos.html">
                            <i class="bi bi-car-front me-2"></i> Veículos
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="servicos.html">
                            <i class="bi bi-tools me-2"></i> Serviços
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="garantias.html">
                            <i class="bi bi-shield-check me-2"></i> Garantias
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="qrcodes.html">
                            <i class="bi bi-qr-code me-2"></i> QR Codes
                        </a>
                    </li>
                </ul>
                <hr class="text-secondary my-4">
                <button onclick="logout()" class="btn btn-outline-danger w-100 btn-sm">
                    <i class="bi bi-box-arrow-left me-2"></i> Sair
                </button>
            </div>
        </nav>

        <!-- Conteúdo Principal -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2 fw-bold text-dark">Gestão de Usuários</h1>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalUsuario">
                    <i class="bi bi-person-plus me-1"></i> Novo Usuário
                </button>
            </div>

            <!-- Tabela de Usuários -->
            <div class="card border-0 shadow-sm rounded-4 p-3">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Usuário</th>
                            <th>Perfil (Role)</th>
                            <th class="text-end">Ações</th>
                        </tr>
                        </thead>
                        <tbody id="tabelaUsuarios">
                        <tr><td colspan="5" class="text-center text-muted">Carregando dados...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<div class="modal fade" id="modalUsuario" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content border-0 shadow rounded-4">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">Adicionar Novo Usuário</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="formUsuario">
                    <div class="mb-3">
                        <label class="form-label">Nome Completo</label>
                        <input type="text" id="nome" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nome de Usuário (Username)</label>
                        <input type="text" id="username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Senha</label>
                        <input type="password" id="password" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Perfil de Acesso</label>
                        <select id="role" class="form-select">
                            <option value="ADMIN">ADMIN</option>
                            <option value="FUNCIONARIO">FUNCIONARIO</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Salvar Usuário</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API_URL = 'https://pdcc-api.onrender.com';

    async function carregarUsuarios() {
        try {
            const res = await fetch(`${API_URL}/api/usuarios`);
            if (res.ok) {
                const usuarios = await res.json();
                const tbody = document.getElementById('tabelaUsuarios');
                tbody.innerHTML = '';
                if (usuarios.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted">Nenhum usuário registado.</td></tr>`;
                    return;
                }
                usuarios.forEach(u => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${u.id}</td>
                            <td class="fw-semibold">${u.nome}</td>
                            <td>${u.username}</td>
                            <td><span class="badge bg-secondary">${u.role}</span></td>
                            <td class="text-end">
                                <button onclick="deletarUsuario(${u.id})" class="btn btn-outline-danger btn-sm"><i class="bi bi-trash"></i></button>
                            </td>
                        </tr>
                    `;
                });
            }
        } catch (e) {
            console.error("Erro ao carregar usuários", e);
        }
    }

    document.getElementById('formUsuario').addEventListener('submit', async (e) => {
        e.preventDefault();
        const dados = {
            nome: document.getElementById('nome').value,
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
            role: document.getElementById('role').value
        };

        const res = await fetch(`${API_URL}/api/usuarios`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(dados)
        });

        if (res.ok) {
            bootstrap.Modal.getInstance(document.getElementById('modalUsuario')).hide();
            document.getElementById('formUsuario').reset();
            carregarUsuarios();
        } else {
            alert('Erro ao criar usuário. Verifique se o username já existe.');
        }
    });

    async function deletarUsuario(id) {
        if (confirm('Tem certeza que deseja remover este usuário?')) {
            const res = await fetch(`${API_URL}/api/usuarios/${id}`, { method: 'DELETE' });
            if (res.ok) carregarUsuarios();
        }
    }

    function logout() {
        localStorage.removeItem('usuarioNome');
        localStorage.removeItem('usuarioRole');
        window.location.href = 'login.html';
    }

    carregarUsuarios();
</script>
</body>
</html>
