<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDCC - Gestão de Veículos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container-fluid">
    <div class="row">
        <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block bg-dark sidebar collapse min-vh-100 p-3 text-white">
            <div class="position-sticky pt-3">
                <h4 class="text-center fw-bold mb-4 text-primary">PDCC</h4>
                <ul class="nav flex-column gap-2">
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="dashboard.html">
                            <i class="bi bi-speedometer2 me-2"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item" id="menuUsuarios" style="display: none;">
                        <a class="nav-link text-white-50" href="usuarios.html">
                            <i class="bi bi-person-lock me-2"></i> Usuários
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="clientes.html">
                            <i class="bi bi-people me-2"></i> Clientes
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white active bg-primary rounded" href="veiculos.html">
                            <i class="bi bi-car-front me-2"></i> Veículos
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="servicos.html">
                            <i class="bi bi-tools me-2"></i> Serviços
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="garantias.html">
                            <i class="bi bi-shield-check me-2"></i> Garantias
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="qrcodes.html">
                            <i class="bi bi-qr-code me-2"></i> QR Codes
                        </a>
                    </li>
                </ul>
                <hr class="text-secondary my-4">
                <button onclick="logout()" class="btn btn-outline-danger w-100 btn-sm">
                    <i class="bi bi-box-arrow-left me-2"></i> Sair
                </button>
            </div>
        </nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2 fw-bold text-dark">Gestão de Veículos</h1>
                <span class="text-muted">Prontuário Digital Curto-Circuito</span>
            </div>

            <div class="card border-0 shadow-sm rounded-4 p-4 mb-4">
                <h5 class="fw-bold mb-3"><i class="bi bi-plus-circle me-2 text-primary"></i>Registar Novo Veículo</h5>
                <form id="veiculoForm">
                    <input type="hidden" id="veiculoId">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="clienteSelect" class="form-label small fw-bold">Cliente</label>
                            <select class="form-select" id="clienteSelect" required>
                                <option value="">Carregando clientes...</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="modelo" class="form-label small fw-bold">Modelo</label>
                            <input type="text" class="form-control" id="modelo" required placeholder="">
                        </div>
                        <div class="col-md-4">
                            <label for="placa" class="form-label small fw-bold">Placa</label>
                            <input type="text" class="form-control" id="placa" required placeholder="">
                        </div>
                        <div class="col-md-4">
                            <label for="ano" class="form-label small fw-bold">Ano</label>
                            <input type="text" class="form-control" id="ano" placeholder="">
                        </div>
                        <div class="col-md-4">
                            <label for="cor" class="form-label small fw-bold">Cor</label>
                            <input type="text" class="form-control" id="cor" placeholder="">
                        </div>
                    </div>
                    <div class="mt-3">
                        <button type="submit" class="btn btn-primary px-4 fw-semibold">
                            <i class="bi bi-check-lg me-1"></i> Salvar Veículo
                        </button>
                    </div>
                </form>
            </div>

            <div class="card border-0 shadow-sm rounded-4 p-4">
                <h5 class="fw-bold mb-3"><i class="bi bi-table me-2 text-primary"></i>Veículos Registados</h5>
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Cliente</th>
                            <th>Modelo</th>
                            <th>Placa</th>
                            <th>Ano</th>
                            <th>Cor</th>
                            <th class="text-center">Ações</th>
                        </tr>
                        </thead>
                        <tbody id="tabelaVeiculos">
                        <tr>
                            <td colspan="7" class="text-center text-muted">Carregando dados...</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const API_URL = 'https://pdcc-api.onrender.com';

    async function carregarSelectClientes() {
        try {
            const response = await fetch(`${API_URL}/api/clientes`);
            if (response.ok) {
                const clientes = await response.json();
                const select = document.getElementById('clienteSelect');
                select.innerHTML = '<option value="">Selecione um cliente</option>';
                clientes.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c.id;
                    opt.textContent = c.nome;
                    select.appendChild(opt);
                });
            }
        } catch (err) {
            console.error("Erro ao carregar clientes para o select:", err);
        }
    }

    async function carregarVeiculos() {
        try {
            const response = await fetch(`${API_URL}/api/veiculos`);
            if (response.ok) {
                const veiculos = await response.json();
                const tabela = document.getElementById('tabelaVeiculos');
                tabela.innerHTML = '';

                if (veiculos.length === 0) {
                    tabela.innerHTML = `<tr><td colspan="7" class="text-center text-muted">Nenhum veículo registado.</td></tr>`;
                    return;
                }

                veiculos.forEach(v => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${v.id}</td>
                        <td class="fw-semibold">${v.cliente ? v.cliente.nome : 'N/D'}</td>
                        <td>${v.modelo}</td>
                        <td><span class="badge bg-secondary">${v.placa}</span></td>
                        <td>${v.ano || '-'}</td>
                        <td>${v.cor || '-'}</td>
                        <td class="text-center">
                            <button onclick="excluirVeiculo(${v.id})" class="btn btn-outline-danger btn-sm">
                                <i class="bi bi-trash"></i> Excluir
                            </button>
                        </td>
                    `;
                    tabela.appendChild(tr);
                });
            }
        } catch (err) {
            console.error("Erro ao carregar veículos:", err);
            document.getElementById('tabelaVeiculos').innerHTML = `
                <tr><td colspan="7" class="text-center text-danger">Erro ao conectar com a API.</td></tr>
            `;
        }
    }

    document.getElementById('veiculoForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const clienteId = document.getElementById('clienteSelect').value;
        const veiculoData = {
            cliente: { id: parseInt(clienteId) },
            modelo: document.getElementById('modelo').value,
            placa: document.getElementById('placa').value,
            ano: document.getElementById('ano').value,
            cor: document.getElementById('cor').value
        };

        try {
            const response = await fetch(`${API_URL}/api/veiculos`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(veiculoData)
            });

            if (response.ok) {
                document.getElementById('veiculoForm').reset();
                carregarVeiculos();
            } else {
                alert('Erro ao salvar o veículo.');
            }
        } catch (err) {
            console.error("Erro ao enviar dados:", err);
        }
    });

    async function excluirVeiculo(id) {
        if (confirm('Deseja realmente excluir este veículo?')) {
            try {
                const response = await fetch(`${API_URL}/api/veiculos/${id}`, {
                    method: 'DELETE'
                });
                if (response.ok) {
                    carregarVeiculos();
                } else {
                    alert('Erro ao excluir veículo.');
                }
            } catch (err) {
                console.error("Erro ao excluir:", err);
            }
        }
    }

    document.addEventListener("DOMContentLoaded", () => {
        const role = localStorage.getItem('usuarioRole');

        if (role === 'ADMIN') {
            const menuU = document.getElementById('menuUsuarios');
            if (menuU) {
                menuU.style.display = 'block';
            }
        }
    });

    function logout() {
        localStorage.removeItem('usuarioNome');
        localStorage.removeItem('usuarioRole');
        window.location.href = 'login.html';
    }

    carregarSelectClientes();
    carregarVeiculos();
</script>
</body>
</html>
